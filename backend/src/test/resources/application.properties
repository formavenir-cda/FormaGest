# Surcharge de test : les fixtures de data.sql sont écrites en SQL MySQL
# (INSERT IGNORE) et @DataJpaTest bascule sur une base H2 embarquée, qui ne
# comprend pas cette syntaxe. On désactive l'exécution de data.sql pour les
# tests ; le schéma est de toute façon recréé par Hibernate (ddl-auto).
spring.sql.init.mode=never

# @SpringBootTest (contrairement à @DataJpaTest) ne bascule pas seul sur une
# datasource de test : sans cette ligne, il chercherait la datasource MySQL de
# application.properties, absente en environnement de test.
spring.datasource.url=jdbc:h2:mem:formagest-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver

# Secret de test en dur (32 octets encodés en Base64), pour que la suite
# tourne sans dépendre de la variable d'environnement APP_JWT_SECRET.
app.jwt.secret=dGVzdC1zZWNyZXQtZm9ybWFnZXN0LTMyLW9jdGV0cy1taW4h
app.jwt.expiration=24h
app.jwt.cookie-name=formagest_token
app.jwt.cookie-secure=false