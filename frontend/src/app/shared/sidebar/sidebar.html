<aside class="fg-sidenav">
  <div class="fg-sidenav__brand">
    <span class="fg-sidenav__logo">F</span>
    <span>FormaGest</span>
  </div>

  <nav class="fg-sidenav__nav" aria-label="Navigation principale">
    @for (item of mainNavItems; track item.label) {
      <a class="fg-sidenav__item" [routerLink]="item.route" routerLinkActive="fg-sidenav__item--active">
        <span class="material-icons">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <button class="fg-sidenav__profile" type="button" aria-label="Menu du compte" [matMenuTriggerFor]="profileMenu">
    <span class="fg-sidenav__avatar">
      <span class="material-icons">person</span>
    </span>

    <span class="material-icons fg-sidenav__profile-chevron">expand_more</span>
  </button>

  <mat-menu #profileMenu="matMenu">
    <button mat-menu-item disabled>
      <span class="material-icons">person</span>
      <span>Profil</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <span class="material-icons">logout</span>
      <span>Déconnexion</span>
    </button>
  </mat-menu>
</aside>
