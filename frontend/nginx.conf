server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Repli SPA : toute route inconnue du serveur renvoie index.html.
    # C'est ensuite le routeur Angular, côté navigateur, qui affiche
    # la bonne vue selon l'URL (nécessaire pour le rafraîchissement
    # de page ou un lien collé directement sur une route interne).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les fichiers dont le nom porte une empreinte
    # (hash de contenu) : ils changent de nom à chaque build.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Compression des réponses texte.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
